services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Bot state (owner.json) and the Google credential under
      # notebooklm/profiles/default/. Must be writable: refreshed cookies are saved here.
      - ./data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
